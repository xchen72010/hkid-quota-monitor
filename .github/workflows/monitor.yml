name: quota-monitor

on:
  repository_dispatch:
    types: [tick]          # 可选外部 cron 每 2 分钟 POST 触发（见 docs/cron-setup.md）
  workflow_dispatch: {}    # 手动触发
  schedule:
    - cron: "*/15 * * * *" # 兜底：外部定时器失效时仍有 15 分钟级监控

concurrency:
  group: quota-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # 浅克隆：数据提交历史每天数百条，全量 clone 会越来越慢
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 先抓取再通知：fetch/diff 与管理员邮件通知均只用标准库
      - name: Run quota check
        id: run
        run: python -m quota_monitor.run

      - name: Send notifications
        continue-on-error: true
        env:
          QQ_SMTP_USER: ${{ secrets.QQ_SMTP_USER }}
          QQ_SMTP_PASS: ${{ secrets.QQ_SMTP_PASS }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: python -m quota_monitor.notify

      - name: Commit data
        id: commit
        env:
          COMMIT_DATA: ${{ steps.run.outputs.commit }}   # 经 env 传入，不内插进 shell
        run: |
          git config user.name "quota-bot"
          git config user.email "actions@users.noreply.github.com"

          # 本轮是否真的改过这两个有状态的文件（必须在任何 reset 之前判定）：
          # 改过 -> 本轮版本更新，应覆盖远端；没改过 -> 保留远端版本，
          # 避免并发轮次把别人刚登记的订阅者/冷却状态冲掉
          roster_mine=$(git status --porcelain -- data/subscribers.json.enc)
          state_mine=$(git status --porcelain -- data/notify_state.json)

          # 本轮产出先搬出工作区，因为下面要把工作区硬对齐远端
          MINE="${RUNNER_TEMP}/data-mine"
          rm -rf "$MINE"; mkdir -p "$MINE"; cp -a data/. "$MINE/"

          CHANGED=false
          for attempt in 1 2 3; do
            if ! git fetch -q origin main; then
              echo "fetch failed, retry $attempt"; sleep $((attempt * 3)); continue
            fi
            # 硬对齐远端：索引与工作区都必须是远端最新。
            # 曾用 reset --soft，那样索引仍是 checkout 时的旧树，提交会把
            # 这期间别人推的代码静默回滚（CI 全绿、push 是快进，看不出异常）。
            git reset -q --hard origin/main

            # 再把「本轮拥有」的文件放回去，只碰 data/ 下这几个。
            # 「数据只进不退」在仓库层还得守一次：排队晚启动的轮次 checkout
            # 的是触发时刻的旧 SHA，它的快照基线因此过期——照抄回去会把
            # 仓库数据往回倒（实测下午源时间戳反复倒退 14:18→14:13→14:16），
            # 看板横跳、diff 重放旧事件。本轮快照比远端旧就整批放弃
            if [ "$COMMIT_DATA" = "true" ]; then
              if python -c "import json,sys,os; from quota_monitor.fetch import ts_of; load=(lambda p: json.load(open(p, encoding='utf-8'))); m=load(sys.argv[1]); r=(load('data/quota.json') if os.path.exists('data/quota.json') else {}); sys.exit(0 if ts_of(m.get('source_update_time','')) >= ts_of(r.get('source_update_time','')) else 1)" "$MINE/quota.json"; then
                for f in quota.json quota_prev.json events.json meta.json; do
                  if [ -f "$MINE/$f" ]; then cp -f "$MINE/$f" "data/$f"; fi
                done
              else
                echo "::warning::本轮快照比远端旧（过期 checkout），放弃覆盖数据文件"
              fi
            fi
            # 注意：COMMIT_DATA=false 时【不要】把 meta.json 复制回来。
            # meta 的 last_check 每轮都变，复制回来必然产生 commit——
            # 曾有个 elif 无条件复制它，run.py 的提交节流因此形同虚设，
            # 忙时照样每分钟一次提交。心跳到期的轮次 COMMIT_DATA 本来
            # 就是 true（run.py 两个分支都把 heartbeat_due 算进输出），
            # 走上面的正路复制，不需要旁路
            # history.jsonl 是 append-only，「最新者胜」对它是错的语义：
            # 以远端为底，只补上本轮新增的行
            if [ -f "$MINE/history.jsonl" ]; then
              if [ -f data/history.jsonl ]; then
                awk 'NR==FNR{seen[$0];next} !($0 in seen)' \
                  data/history.jsonl "$MINE/history.jsonl" >> data/history.jsonl
              else
                cp -f "$MINE/history.jsonl" data/history.jsonl
              fi
            fi
            if [ -n "$roster_mine" ] && [ -f "$MINE/subscribers.json.enc" ]; then
              cp -f "$MINE/subscribers.json.enc" data/subscribers.json.enc
            fi
            if [ -n "$state_mine" ] && [ -f "$MINE/notify_state.json" ]; then
              cp -f "$MINE/notify_state.json" data/notify_state.json
            fi

            git add data/
            if git diff --cached --quiet; then
              echo "nothing to commit"; break
            fi
            git commit -q -m "data: $(date -u +'%Y-%m-%dT%H:%M:%SZ') [skip ci]"
            if git push -q origin HEAD:main; then
              CHANGED=true; break
            fi
            echo "::warning::push raced with another run, retry $attempt"
            sleep $((attempt * 3))
          done
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          if [ "$CHANGED" = "false" ] && [ -n "$(git log origin/main..HEAD --oneline)" ]; then
            # 数据提交失败不判整轮失败（抓取与通知已完成），但要留告警痕迹
            echo "::warning::data commit gave up after retries"
          fi

      - name: Purge jsDelivr cache (mainland mirror freshness)
        run: |
          # purge API 有按路径的配额：1 分钟 cron 后每分钟清一次直接打满，
          # 之后全部返回 throttled:true 且被 || true 吞掉——镜像因此冻结 6 小时。
          # 只按时间窗口执行，不再看本轮是否有提交：绑「恰好有提交 且 恰好在
          # 窗口」两个巧合，下午提交稀疏时能连续 3 小时碰不上，镜像照样烂
          # （实测停到 3.5 小时前）。内容没变时白清一次也无妨，新鲜度优先。
          # 最坏 ~8 次/小时/路径，仍在配额内；响应打日志，throttled 要看得见
          M=$((10#$(date +%M) % 15))
          if [ "$M" -ge 2 ]; then echo "skip purge (quota window, minute=$(date +%M))"; exit 0; fi
          for f in index.html config.json data/quota.json data/meta.json data/history.jsonl; do
            resp=$(curl -sS -m 20 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/${f}" || echo curl-failed)
            echo "purge $f -> $(echo "$resp" | tr -d '\n' | head -c 160)"
          done
